# dlzmod (#140): normal scheduling instead of stock's real-time (SCHED_FIFO 20), Nice=-20 kept.
# With RT throttling off (sched_rt_runtime_us -1), Mackie's real-time GUI and node processes can
# keep cores 0-2 during a start and starve Weston/Xwayland, the log and the SD write-back, which
# are normal processes (notes/system.md, "Scheduling"). dspserver stays real-time.
# Priority 0 explicitly: normal scheduling takes no other value, and an empty one keeps stock's 20.
[Service]
CPUSchedulingPolicy=other
CPUSchedulingPriority=0
