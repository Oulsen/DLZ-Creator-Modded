# dlzmod (#96): Weston takes the display only after the update step, so while an update installs the
# screen keeps the message dlzmod-update draws on the framebuffer. No later start for it: Weston's own
# first step (chvt 7) waits until ~17-19 s anyway, the update step is done at ~12-13 s [device].
[Unit]
After=dlzmod-update.service
