# DLZ Creator Modded: the card ships without Mackie's SSH host keys (every mixer has the same ones),
# so the first start makes this card's own; then the stock config check. Only runs when the owner
# turns SSH on (Mod page): the card leaves ssh.service disabled.
# SSH starts only while one of the server mod's markers exists (DLZMOD_sshPaths in
# dlzmod-server.js): the one in /run from turning it on, gone after a restart, so SSH is off again
# after every start, or the one on the card for "Keep on after a restart". Stock's own condition
# (no /etc/ssh/sshd_not_to_be_run) still applies on top.
[Unit]
ConditionPathExists=|/run/dlzmod-ssh-on
ConditionPathExists=|/var/lib/dlzmod-ssh/keep-on

[Service]
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
# Password guessing slowed down (OpenSSH 8.9 has no penalties of its own): 3 tries per connection,
# 20 s to log in, and from 3 unfinished logins on, new connections are dropped more and more. -o
# options win over sshd_config; stock's ExecStart otherwise unchanged.
ExecStart=
ExecStart=/usr/sbin/sshd -D $SSHD_OPTS -o MaxAuthTries=3 -o LoginGraceTime=20 -o MaxStartups=3:50:10
