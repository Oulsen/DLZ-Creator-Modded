# dlzmod (SD system): dspserver must not finish its init before server.js listens, see
# /usr/local/sbin/dlzmod-wait-hub. Stock gets this order by luck of timing.
# Its stdout line-buffered (what stdbuf -oL does, with stock's ExecStart): block-buffered into the
# journal, its init lines (audio chips, I2C retries) reached the log minutes later or never.
[Service]
ExecStartPre=/usr/local/sbin/dlzmod-wait-hub
TimeoutStartSec=60
Environment=LD_PRELOAD=/usr/libexec/coreutils/libstdbuf.so _STDBUF_O=L
