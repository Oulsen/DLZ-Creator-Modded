# dlzmod (SD system): the FPGA gets its bitstream only when this card is in the mixer it was made for,
# with that model's firmware marks (dlzmod-cardcheck). On a failure flash-fpga does not run, and
# faderlink and dspserver, which Require it, do not start either: no audio, the screen still works.
[Service]
ExecStartPre=/usr/local/sbin/dlzmod-cardcheck
