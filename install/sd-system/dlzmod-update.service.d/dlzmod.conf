# dlzmod (#141): without systemd's default dependencies, so this unit no longer waits for
# basic.target, which waits for the FPGA load (faderlink is Before=basic.target): ordered before
# Mackie's node processes, it held them back to ~16 s, where stock starts them at ~9.5 s.
# Still after the eMMC lock and local-fs.target (the unit's own lines) and sysinit.target, and
# stopped at shutdown, as the default dependencies did.
[Unit]
DefaultDependencies=no
After=sysinit.target
Conflicts=shutdown.target
Before=shutdown.target
