# A version tag prepares its GitHub release (docs/DEVELOPMENT.md, "Releases", step 5): an annotated
# tag vX.Y.Z on main makes a draft release vX.Y.Z with the notes from install/release/release-notes.sh
# (the CHANGELOG.md section, grouped, with issue numbers, and the GPL source note). The release files
# are built in the pinned build environment and attached to the draft (#158): signed with the
# release key from the protected environment "release" (the maintainer approves the job). The PC
# builds the same commit and compares (.claude/skills/release-build/release.sh compare) before the
# mixer test; publishing stays a click by the maintainer.
# A test tag vX.Y.Z-testN (any branch) makes a draft "vX.Y.Z-testN (test)" with the same files
# unsigned (no key, no approval): delete both afterwards.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  issues: read

jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ $TAG =~ ^v[0-9]\.[0-9]{1,2}\.[0-9]{1,2}(-test[0-9]+)?$ ]] \
            || { echo "::error::$TAG is no version tag (vX.Y.Z, or vX.Y.Z-testN for a try)"; exit 1; }
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          [ "$(git cat-file -t "refs/tags/$TAG")" = tag ] \
            || { echo "::error::$TAG is a lightweight tag: make an annotated one (git tag -a $TAG -m $TAG)"; exit 1; }
          case $TAG in
            *-test*) ;;
            *) git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
                 || { echo "::error::$TAG is not on main: tag the commit main points to after the release PR"; exit 1; } ;;
          esac

      - name: Notes
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --milestone "${TAG%%-test*}" --state all --limit 500 \
            --json number,title --jq '.[] | "\(.number)\t\(.title)"' > "$RUNNER_TEMP/issues.txt"
          [ -s "$RUNNER_TEMP/issues.txt" ] || { echo "::error::milestone ${TAG%%-test*} has no issues (or gh could not list them)"; exit 1; }
          bash install/release/release-notes.sh "$TAG" "$RUNNER_TEMP/issues.txt" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Draft release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          title=$TAG
          case $TAG in *-test*) title="$TAG (test)" ;; esac
          gh release create "$TAG" --draft --verify-tag --title "$title" --notes-file "$RUNNER_TEMP/notes.md"

  # a test tag: the release files unsigned, from any branch; never the release environment
  build-test:
    needs: draft
    if: contains(github.ref_name, '-test')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # no token in .git/config: the repo is mounted into the build
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build (unsigned)
        env:
          TAG: ${{ github.ref_name }}
        run: bash install/release/ci-build.sh "$TAG"
      - name: Attach to the draft
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/release
          mapfile -t files < attach.txt
          gh release upload "$TAG" --clobber "${files[@]}"
          echo "Draft $TAG: unsigned test build attached; compare on the PC (release.sh compare $TAG)"

  # a release tag (on main, checked by draft): signed with the release key; the job waits for the
  # maintainer's approval of the environment "release" before the key is handed out
  build-release:
    needs: draft
    if: ${{ !contains(github.ref_name, '-test') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    steps:
      # no token in .git/config: the repo is mounted into the build
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and sign
        env:
          TAG: ${{ github.ref_name }}
          DLZMOD_RELEASE_KEY: ${{ secrets.DLZMOD_RELEASE_KEY }}
          DLZMOD_SIGNING_PASS: ${{ secrets.DLZMOD_SIGNING_PASS }}
        run: bash install/release/ci-build.sh "$TAG"
      - name: Attach to the draft
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/release
          mapfile -t files < attach.txt
          gh release upload "$TAG" --clobber "${files[@]}"
          echo "Draft $TAG: signed build attached; compare on the PC (release.sh compare $TAG), test on the mixer, then publish."
