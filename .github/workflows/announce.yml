# A published release is announced in the project's Discord (docs/DEVELOPMENT.md, "Releases", step 5):
# @everyone, the release's name, the highlights from the top of its notes (the "- " lines before the
# first heading: drafted by install/release/release-notes.sh, edited by the maintainer for owners),
# how to get it (an update from the version named in "**Update from vX.Y.Z", else a new install only)
# and the link. Drafts never trigger this; test releases (vX.Y.Z-testN) are skipped. The release is read
# again from GitHub, so a re-run after fixing the notes posts the fixed text; notes that still hold
# release-notes.sh's "Before publishing, replace this line", or no highlights, are refused. The webhook
# URL is the DISCORD_WEBHOOK secret (set by the maintainer with `gh secret set DISCORD_WEBHOOK`);
# without it the job says so and posts nothing.
name: announce

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  discord:
    if: ${{ !contains(github.event.release.tag_name, '-test') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Message in Discord
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -n "$DISCORD_WEBHOOK" ] || { echo "::notice::No DISCORD_WEBHOOK secret: no message in Discord"; exit 0; }
          gh release view "$TAG" --json name,body,url > "$RUNNER_TEMP/release.json"
          # the text goes into the JSON by jq only, never through the shell
          if ! jq -e '
                ((.body // "") | gsub("\r"; "")) as $body
                | if ($body | contains("Before publishing, replace this line")) then
                    "The notes still say \"Before publishing, replace this line\"" | halt_error
                  else . end
                | ($body | split("\n")) as $lines
                | [$lines[:($lines | map(startswith("### ")) | index(true)) // ($lines | length)][]
                   | select(startswith("- ")) | sub(" \\(#[0-9]+\\)$"; "")] as $hl
                | if ($hl | length) == 0 then "The notes have no highlights (\"- \" lines before the first heading)" | halt_error else . end
                | ([$body | capture("\\*\\*Update from (?<v>v[0-9]+\\.[0-9]+\\.[0-9]+)")][0].v) as $from
                | ("@everyone DLZ Creator Modded " + (if (.name // "") == "" then env.TAG else .name end) + "!\n\n"
                   + ($hl | join("\n")) + "\n\n"
                   + (if $from then "Already on " + $from + ": drop the update files into DLZDATA/dlzmod-update and switch on. New install: write the installer image to a card. Both are explained in the README."
                      else "New install only: copy your recordings off the card, then write the installer image to it. Explained in the README." end)
                   + "\n" + .url) as $text
                | if ($text | length) > 2000 then "The message is longer than Discord takes (2000 characters): shorten the highlights" | halt_error else . end
                | {content: $text, allowed_mentions: {parse: ["everyone"]}}
              ' "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/message.json" 2> "$RUNNER_TEMP/err"; then
            echo "::error::$TAG: $(cat "$RUNNER_TEMP/err"); edit the notes on GitHub, then re-run this job"
            exit 1
          fi
          jq -r .content "$RUNNER_TEMP/message.json"
          curl -fsS --retry 3 -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/message.json" \
            "$DISCORD_WEBHOOK" > /dev/null
          echo "Posted in Discord: $TAG"
